<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBref - IB Math Reference Files</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --muted-color: #6c757d;
      --accent-color: #0d6efd;
      --border-color: #e9ecef;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--bg-color);
      margin: 0;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 2.25rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: #1a1a1a;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    h2 {
      font-size: 1.5rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
      color: #2c3e50;
    }

    p.lead {
      font-size: 1.1rem;
      color: var(--muted-color);
      margin-bottom: 2rem;
    }

    ul.file-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ul.file-list li {
      margin-bottom: 0.75rem;
    }

    ul.file-list a {
      display: block;
      padding: 0.75rem 1rem;
      background-color: #f1f3f5;
      color: var(--accent-color);
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
